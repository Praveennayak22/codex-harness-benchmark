<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.mjs" type="module" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">BENCHMARK DEMO</div>
      <h1>TaskFlow</h1>
      <p>Keep work organized, one task at a time.</p>
    </header>
    <section class="panel">
      <h2>Add a task</h2>
      <form id="task-form">
        <input id="title" aria-label="New task" placeholder="What needs to be done?" required>
        <select id="priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add task</button>
      </form>
    </section>
    <section class="panel">
      <div class="heading"><h2>Your tasks</h2><span id="stats"></span></div>
      <div class="filters">
        <input id="search" aria-label="Search tasks" placeholder="Search tasks...">
        <select id="status" aria-label="Filter status">
          <option value="all">All tasks</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <ul id="task-list" aria-live="polite"></ul>
    </section>
    <footer>Small reproducible JavaScript coding benchmark.</footer>
  </main>
</body>
</html>
